[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "platypus-tui"
version = "0.1.0"
description = "Interactive TUI for Linux server setup (Docker, Caddy, SSH, UFW, VPN)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "textual>=0.60.0",
]

[project.scripts]
platypus-tui = "tui.app:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools]
packages = ["tui", "tui.tasks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
