[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "platypus-tui"
version = "0.1.0"
description = "Interactive TUI and web dashboard for Linux server setup and monitoring"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "textual>=0.60.0",
]

[project.scripts]
platypus-tui = "tui.app:main"
platypus-dashboard = "dashboard.app:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
dashboard = [
    "flask>=3.0",
    "psutil>=5.9",
]

[tool.setuptools]
packages = ["tui", "tui.tasks", "dashboard"]

[tool.setuptools.package-data]
dashboard = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
