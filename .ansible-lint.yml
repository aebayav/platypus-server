---
# ansible-lint configuration
profile: production

exclude_paths:
  - .cache/
  - collections/
  - .github/
  - .molecule/
  # Python package data (role templates for the recipe system), not
  # Ansible content — the repo's own yamllint still covers them.
  - recipe/roles/

# skip_list:
#   - name[missing]
#   - fqcn[action-core]

warn_list:
  - experimental
  - jinja[spacing]

offline: false
