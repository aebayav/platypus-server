<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Platypus Dashboard — Login</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #181b22;
    --border: #262a33;
    --text: #e6e8eb;
    --muted: #8b93a1;
    --red: #e74c3c;
    --accent: #4da3ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .login-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 40px 36px;
    width: 340px;
  }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 28px; }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14px;
    margin-bottom: 16px;
  }
  input:focus { outline: none; border-color: var(--accent); }
  button {
    width: 100%;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 11px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 4px;
  }
  button:hover { opacity: 0.88; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  #error {
    display: none;
    background: #3d1a1a;
    border: 1px solid var(--red);
    color: var(--red);
    font-size: 13px;
    padding: 8px 12px;
    border-radius: 8px;
    margin-top: 14px;
  }
  .warn {
    background: #3a3010;
    border: 1px solid #f1c40f44;
    color: #f1c40f;
    font-size: 12px;
    padding: 8px 12px;
    border-radius: 8px;
    margin-bottom: 20px;
  }
</style>
</head>
<body>
<div class="login-card">
  <h1>Platypus Dashboard</h1>
  <div class="sub">Sign in to continue</div>
  <div class="warn" id="default-warn" style="display:none">
    Default credentials are in use. Set <code>DASHBOARD_USER</code> and
    <code>DASHBOARD_PASSWORD</code> environment variables.
  </div>
  <form id="login-form">
    <label for="username">Username</label>
    <input id="username" type="text" autocomplete="username" required>
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <button type="submit" id="submit-btn">Sign in</button>
    <div id="error">Invalid username or password.</div>
  </form>
</div>
<script>
  // Show warning if server signals default credentials are active
  fetch("/api/auth/info").then(r => r.json()).then(d => {
    if (d.default_credentials)
      document.getElementById("default-warn").style.display = "block";
  }).catch(() => {});

  document.getElementById("login-form").addEventListener("submit", async ev => {
    ev.preventDefault();
    const btn = document.getElementById("submit-btn");
    btn.disabled = true;
    btn.textContent = "Signing in…";
    document.getElementById("error").style.display = "none";
    try {
      const res = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          username: document.getElementById("username").value,
          password: document.getElementById("password").value,
        }),
      });
      if (res.ok) {
        window.location.href = "/";
      } else {
        document.getElementById("error").style.display = "block";
      }
    } catch {
      document.getElementById("error").textContent = "Connection error.";
      document.getElementById("error").style.display = "block";
    }
    btn.disabled = false;
    btn.textContent = "Sign in";
  });
</script>
</body>
</html>
