<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Platypus Dashboard</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #181b22;
    --border: #262a33;
    --text: #e6e8eb;
    --muted: #8b93a1;
    --green: #2ecc71;
    --red: #e74c3c;
    --yellow: #f1c40f;
    --accent: #4da3ff;
    --bar-bg: #262a33;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 24px;
    min-height: 100vh;
  }

  /* ── Header ─────────────────────────────────── */
  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 28px;
  }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .subtitle { color: var(--muted); font-size: 13px; }

  #conn-banner {
    display: none;
    background: #3d1a1a;
    border: 1px solid var(--red);
    color: var(--red);
    font-size: 13px;
    padding: 8px 14px;
    border-radius: 8px;
    margin-bottom: 16px;
  }

  /* ── Metric cards ───────────────────────────── */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 16px;
    margin-bottom: 32px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px;
  }
  .card h3 {
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 10px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
  }
  .value { font-size: 26px; font-weight: 600; line-height: 1; }
  .badge { font-size: 12px; color: var(--muted); margin-top: 6px; }

  .bar {
    height: 6px;
    background: var(--bar-bg);
    border-radius: 3px;
    overflow: hidden;
    margin-top: 14px;
  }
  .bar > div {
    height: 100%;
    width: 0;
    border-radius: 3px;
    transition: width 0.5s ease, background 0.5s ease;
    background: var(--green);
  }
  .bar > div.warn { background: var(--yellow); }
  .bar > div.crit { background: var(--red); }

  .temp-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .temp-chip {
    border: 1px solid var(--border);
    padding: 5px 10px;
    border-radius: 8px;
    font-size: 13px;
    background: var(--bg);
  }
  .temp-chip.warm { border-color: var(--yellow); color: var(--yellow); }
  .temp-chip.hot  { border-color: var(--red);    color: var(--red); }

  .net-row { display: flex; gap: 20px; margin-top: 8px; }
  .net-item { font-size: 13px; }
  .net-label { color: var(--muted); font-size: 11px; }

  /* ── Section header ─────────────────────────── */
  .section-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 8px 0 16px;
  }
  .section-header h2 { font-size: 15px; white-space: nowrap; }
  .section-header::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* ── Forms ──────────────────────────────────── */
  .tool-form {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  .tool-form input {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 13px;
    flex: 1;
    min-width: 140px;
  }
  .tool-form input:focus { outline: none; border-color: var(--accent); }
  .tool-form button {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 8px 18px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
  }
  .tool-form button:hover { opacity: 0.88; }
  .tool-form button:disabled { opacity: 0.5; cursor: not-allowed; }

  /* ── Container cards ────────────────────────── */
  .containers {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 12px;
    margin-bottom: 32px;
  }
  .container-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
  }
  .container-top {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }
  .cinfo { flex: 1; min-width: 0; }
  .cname { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cbadge { font-size: 12px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .state-pill {
    font-size: 11px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 20px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .state-pill.running    { background: #1a3a27; color: var(--green); }
  .state-pill.exited,
  .state-pill.dead       { background: #3d1a1a; color: var(--red); }
  .state-pill.created,
  .state-pill.paused     { background: #3a3010; color: var(--yellow); }
  .state-pill.restarting { background: #1a2e3a; color: var(--accent); }

  /* Per-container mini stats */
  .cstats {
    display: flex;
    gap: 16px;
    margin-bottom: 10px;
    font-size: 12px;
  }
  .cstat-item { display: flex; flex-direction: column; gap: 2px; }
  .cstat-label { color: var(--muted); font-size: 11px; }
  .cstat-bar {
    height: 4px;
    width: 80px;
    background: var(--bar-bg);
    border-radius: 2px;
    overflow: hidden;
    margin-top: 3px;
  }
  .cstat-bar > div {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    transition: width 0.4s;
  }
  .cstat-bar > div.warn { background: var(--yellow); }
  .cstat-bar > div.crit { background: var(--red); }

  /* Action buttons */
  .actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .btn {
    background: var(--border);
    color: var(--text);
    border: none;
    border-radius: 6px;
    padding: 5px 10px;
    font-size: 12px;
    cursor: pointer;
    white-space: nowrap;
  }
  .btn:hover { opacity: 0.8; }
  .btn.primary { background: #1a2e3a; color: var(--accent); border: 1px solid var(--accent); }
  .btn.danger  { background: #3d1a1a; color: var(--red);    border: 1px solid var(--red); }
  .btn.danger:hover  { background: var(--red);    color: #fff; }
  .btn.primary:hover { background: var(--accent); color: #fff; }

  /* ── Images table ───────────────────────────── */
  .images-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    margin-bottom: 32px;
  }
  .images-table th {
    text-align: left;
    color: var(--muted);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 0 10px 10px;
    border-bottom: 1px solid var(--border);
  }
  .images-table td {
    padding: 10px;
    border-bottom: 1px solid var(--border);
    color: var(--text);
  }
  .images-table tr:last-child td { border-bottom: none; }
  .images-table tr:hover td { background: var(--card); }
  .img-id { font-family: monospace; color: var(--muted); }

  /* ── Services ───────────────────────────────── */
  .services {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 12px;
    margin-bottom: 32px;
  }
  .service {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 16px;
    background: var(--card);
    border: 1px solid var(--border);
    border-left-width: 3px;
    border-radius: 10px;
    transition: border-color 0.3s;
  }
  .service.up      { border-left-color: var(--green); }
  .service.down    { border-left-color: var(--red); }
  .service.unknown { border-left-color: var(--yellow); }
  .sname { font-weight: 600; font-size: 14px; }
  .surl  { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .scode {
    font-size: 11px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 20px;
    margin-left: 8px;
    flex-shrink: 0;
  }
  .scode.up      { background: #1a3a27; color: var(--green); }
  .scode.down    { background: #3d1a1a; color: var(--red); }
  .scode.unknown { background: #3a3010; color: var(--yellow); }

  .empty { color: var(--muted); font-size: 13px; padding: 4px 0; }

  /* ── Log Modal ──────────────────────────────── */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    width: min(860px, 95vw);
    max-height: 80vh;
    display: flex;
    flex-direction: column;
  }
  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .modal-title { font-weight: 600; font-size: 15px; }
  .modal-close {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 20px;
    cursor: pointer;
    line-height: 1;
    padding: 0 4px;
  }
  .modal-close:hover { color: var(--text); }
  .modal-body {
    flex: 1;
    overflow-y: auto;
    padding: 14px 20px;
  }
  .log-output {
    font-family: "Fira Code", "Cascadia Code", "Consolas", monospace;
    font-size: 12px;
    line-height: 1.6;
    color: #c9d1d9;
    white-space: pre-wrap;
    word-break: break-all;
  }
  .log-empty { color: var(--muted); font-size: 13px; }

  /* pull status message */
  #pull-status {
    font-size: 13px;
    margin-left: 8px;
    color: var(--muted);
  }
</style>
</head>
<body>

  <div id="conn-banner">Connection lost — retrying…</div>

  <header>
    <div>
      <h1>Platypus Dashboard</h1>
      <div class="subtitle" id="last-updated">connecting…</div>
    </div>
    <div class="subtitle" id="uptime">—</div>
  </header>

  <!-- Metric cards -->
  <div class="grid">
    <div class="card">
      <h3>CPU</h3>
      <div class="value" id="cpu">—</div>
      <div class="badge" id="cpu-cores">—</div>
      <div class="badge" id="load">—</div>
      <div class="bar"><div id="cpu-bar"></div></div>
    </div>
    <div class="card">
      <h3>Memory</h3>
      <div class="value" id="mem">—</div>
      <div class="badge" id="mem-pct">—</div>
      <div class="bar"><div id="mem-bar"></div></div>
    </div>
    <div class="card">
      <h3>Disk</h3>
      <div class="value" id="disk">—</div>
      <div class="badge" id="disk-free">—</div>
      <div class="bar"><div id="disk-bar"></div></div>
    </div>
    <div class="card">
      <h3>Temperature</h3>
      <div class="temp-grid" id="temps"><span class="badge">no sensors</span></div>
    </div>
    <div class="card">
      <h3>Network</h3>
      <div class="net-row">
        <div class="net-item">
          <div class="net-label">Received</div>
          <div id="net-recv">—</div>
        </div>
        <div class="net-item">
          <div class="net-label">Sent</div>
          <div id="net-sent">—</div>
        </div>
      </div>
      <div class="badge" id="net-packets" style="margin-top:10px">—</div>
    </div>
  </div>

  <!-- Containers -->
  <div class="section-header"><h2>Containers</h2></div>
  <form class="tool-form" id="run-form">
    <input id="run-image" list="image-list" placeholder="image (e.g. nginx:latest)" autocomplete="off">
    <datalist id="image-list"></datalist>
    <input id="run-name"  placeholder="name (optional)">
    <input id="run-ports" placeholder="ports (e.g. 8080:80)">
    <button type="submit">Run Container</button>
  </form>
  <div class="containers" id="containers"><div class="empty">loading…</div></div>

  <!-- Images -->
  <div class="section-header"><h2>Images</h2></div>
  <form class="tool-form" id="pull-form">
    <input id="pull-image" placeholder="image to pull (e.g. nginx:latest)">
    <button type="submit" id="pull-btn">Pull</button>
    <span id="pull-status"></span>
  </form>
  <table class="images-table" id="images-table">
    <thead>
      <tr>
        <th>Image</th>
        <th>ID</th>
        <th>Size</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="images-body"><tr><td colspan="4" class="empty" style="padding:12px 10px">loading…</td></tr></tbody>
  </table>

  <!-- Services -->
  <div class="section-header"><h2>Services</h2></div>
  <div class="services" id="services"></div>

  <!-- Log Modal -->
  <div class="modal-overlay" id="log-modal">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title" id="log-modal-title">Logs</span>
        <button class="modal-close" id="log-close">&times;</button>
      </div>
      <div class="modal-body">
        <div class="log-output" id="log-content"></div>
      </div>
    </div>
  </div>

<script>
  /* ── Helpers ──────────────────────────────────────────────────── */
  function fmtBytes(n) {
    if (n == null) return "—";
    const units = ["B", "KB", "MB", "GB", "TB"];
    let i = 0;
    while (n >= 1024 && i < units.length - 1) { n /= 1024; i++; }
    return n.toFixed(1) + " " + units[i];
  }

  function fmtUptime(s) {
    if (s == null) return "—";
    const d = Math.floor(s / 86400);
    const h = Math.floor((s % 86400) / 3600);
    const m = Math.floor((s % 3600) / 60);
    return "uptime " + (d ? d + "d " : "") + h + "h " + m + "m";
  }

  function setBar(id, pct) {
    const el = document.getElementById(id);
    if (!el) return;
    const v = Math.max(0, Math.min(100, pct));
    el.style.width = v + "%";
    el.classList.remove("warn", "crit");
    if (v >= 90) el.classList.add("crit");
    else if (v >= 70) el.classList.add("warn");
  }

  function colorBar(el, pct) {
    el.style.width = Math.max(0, Math.min(100, pct)) + "%";
    el.classList.remove("warn", "crit");
    if (pct >= 90) el.classList.add("crit");
    else if (pct >= 70) el.classList.add("warn");
  }

  /* ── System metrics ───────────────────────────────────────────── */
  function render(data) {
    const m = data.metrics || {};

    const cpuPct = m.cpu_percent ?? null;
    document.getElementById("cpu").textContent = cpuPct != null ? cpuPct.toFixed(1) + "%" : "—";
    document.getElementById("cpu-cores").textContent = m.cpu_count ? m.cpu_count + " cores" : "—";
    document.getElementById("load").textContent = m.load_avg ? "load avg  " + m.load_avg.join(" / ") : "";
    setBar("cpu-bar", cpuPct || 0);

    const mem = m.memory || {};
    document.getElementById("mem").textContent = mem.used != null ? fmtBytes(mem.used) + " / " + fmtBytes(mem.total) : "—";
    document.getElementById("mem-pct").textContent = mem.percent != null ? mem.percent.toFixed(1) + "% used" : "—";
    setBar("mem-bar", mem.percent || 0);

    const disk = m.disk || {};
    document.getElementById("disk").textContent = disk.used != null ? fmtBytes(disk.used) + " / " + fmtBytes(disk.total) : "—";
    document.getElementById("disk-free").textContent = disk.free != null ? fmtBytes(disk.free) + " free" : "—";
    setBar("disk-bar", disk.percent || 0);

    const temps = m.temperatures || {};
    const tempEl = document.getElementById("temps");
    const keys = Object.keys(temps);
    if (keys.length) {
      tempEl.innerHTML = keys.map(k => {
        const v = temps[k];
        const cls = v >= 85 ? "hot" : v >= 70 ? "warm" : "";
        return `<span class="temp-chip ${cls}">${k}: <b>${v}°C</b></span>`;
      }).join("");
    } else {
      tempEl.innerHTML = '<span class="badge">no sensors</span>';
    }

    const net = m.network || {};
    document.getElementById("net-recv").textContent = net.bytes_recv != null ? fmtBytes(net.bytes_recv) : "—";
    document.getElementById("net-sent").textContent = net.bytes_sent != null ? fmtBytes(net.bytes_sent) : "—";
    document.getElementById("net-packets").textContent = net.packets_recv != null
      ? `${net.packets_recv.toLocaleString()} pkts in  /  ${net.packets_sent.toLocaleString()} pkts out` : "—";

    document.getElementById("uptime").textContent = fmtUptime(m.uptime_seconds);

    const services = data.services || [];
    document.getElementById("services").innerHTML = services.length
      ? services.map(s => {
          const sc = s.status || "unknown";
          const code = s.http_code ? s.http_code : (sc === "up" ? "UP" : sc === "down" ? "DOWN" : "?");
          return `<div class="service ${sc}">
            <div><div class="sname">${s.name}</div><div class="surl">${s.url || ""}</div></div>
            <span class="scode ${sc}">${code}</span>
          </div>`;
        }).join("")
      : '<div class="empty">No services configured.</div>';

    document.getElementById("conn-banner").style.display = "none";
    const upd = document.getElementById("last-updated");
    upd.textContent = "updated " + new Date().toLocaleTimeString();
    upd.style.color = "";
  }

  async function refresh() {
    try {
      const res = await fetch("/api/status");
      if (!res.ok) throw new Error();
      render(await res.json());
    } catch {
      document.getElementById("conn-banner").style.display = "block";
      const upd = document.getElementById("last-updated");
      upd.textContent = "connection error";
      upd.style.color = "var(--red)";
    }
  }

  /* ── Containers ───────────────────────────────────────────────── */
  async function loadContainerStats(cid, card) {
    try {
      const res = await fetch(`/api/containers/${cid}/stats`);
      if (!res.ok) return;
      const s = await res.json();
      const cpuPct = parseFloat(s.cpu_percent) || 0;
      const memPct = parseFloat(s.mem_percent) || 0;
      card.querySelector(".cstat-cpu-val").textContent = cpuPct.toFixed(1) + "%";
      card.querySelector(".cstat-mem-val").textContent = s.mem_usage || "—";
      colorBar(card.querySelector(".cstat-cpu-bar div"), cpuPct);
      colorBar(card.querySelector(".cstat-mem-bar div"), memPct);
    } catch { /* silent */ }
  }

  function renderContainers(containers) {
    const el = document.getElementById("containers");
    if (!containers.length) {
      el.innerHTML = '<div class="empty">No containers found.</div>';
      return;
    }
    el.innerHTML = containers.map(c => {
      const sc = c.state || "unknown";
      const label = sc.charAt(0).toUpperCase() + sc.slice(1);
      const isRunning = sc === "running";
      return `
        <div class="container-card" data-id="${c.id}" data-state="${sc}">
          <div class="container-top">
            <div class="cinfo">
              <div class="cname">${c.name}</div>
              <div class="cbadge">${c.image}${c.ports ? " · " + c.ports : ""}</div>
            </div>
            <span class="state-pill ${sc}">${label}</span>
          </div>
          ${isRunning ? `
          <div class="cstats">
            <div class="cstat-item">
              <span class="cstat-label">CPU</span>
              <span class="cstat-cpu-val" style="font-size:12px">…</span>
              <div class="cstat-bar cstat-cpu-bar"><div></div></div>
            </div>
            <div class="cstat-item">
              <span class="cstat-label">Memory</span>
              <span class="cstat-mem-val" style="font-size:12px">…</span>
              <div class="cstat-bar cstat-mem-bar"><div></div></div>
            </div>
          </div>` : ""}
          <div class="actions">
            ${!isRunning ? `<button class="btn" data-act="start"   data-id="${c.id}">Start</button>` : ""}
            ${isRunning  ? `<button class="btn" data-act="stop"    data-id="${c.id}">Stop</button>` : ""}
            ${isRunning  ? `<button class="btn" data-act="restart" data-id="${c.id}">Restart</button>` : ""}
            <button class="btn primary" data-act="logs"   data-id="${c.id}" data-name="${c.name}">Logs</button>
            <button class="btn danger"  data-act="remove" data-id="${c.id}">Remove</button>
          </div>
        </div>`;
    }).join("");

    // Attach events
    el.querySelectorAll("button[data-act]").forEach(btn => {
      btn.addEventListener("click", () => containerAction(btn.dataset.act, btn.dataset.id, btn.dataset.name));
    });

    // Fetch stats for running containers
    el.querySelectorAll(".container-card[data-state='running']").forEach(card => {
      loadContainerStats(card.dataset.id, card);
    });
  }

  function renderImageList(images) {
    document.getElementById("image-list").innerHTML = images
      .map(i => `<option value="${i.name}">`).join("");
  }

  async function containerAction(action, id, name) {
    if (action === "remove" && !confirm(`Remove container "${name || id}"?`)) return;

    if (action === "logs") {
      openLogs(id, name || id);
      return;
    }

    const url = action === "remove"
      ? `/api/containers/${id}`
      : `/api/containers/${id}/${action}`;
    const method = action === "remove" ? "DELETE" : "POST";
    try {
      const res = await fetch(url, { method });
      if (!res.ok) {
        const d = await res.json().catch(() => ({}));
        alert(d.error || "Operation failed.");
      }
    } catch { alert("Connection error."); }
    loadContainers();
  }

  async function loadContainers() {
    try {
      const [cres, ires] = await Promise.all([
        fetch("/api/containers"),
        fetch("/api/images"),
      ]);
      const containers = (await cres.json()).containers || [];
      const images     = (await ires.json()).images || [];
      renderContainers(containers);
      renderImageList(images);
      renderImages(images);
    } catch {
      document.getElementById("containers").innerHTML =
        '<div class="empty" style="color:var(--red)">Docker unavailable.</div>';
    }
  }

  document.getElementById("run-form").addEventListener("submit", async ev => {
    ev.preventDefault();
    const payload = {
      image: document.getElementById("run-image").value,
      name:  document.getElementById("run-name").value,
      ports: document.getElementById("run-ports").value,
    };
    try {
      const res = await fetch("/api/containers", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      const d = await res.json().catch(() => ({}));
      if (!res.ok) alert(d.error || "Run failed.");
      else { document.getElementById("run-form").reset(); loadContainers(); }
    } catch { alert("Connection error."); }
  });

  /* ── Images ───────────────────────────────────────────────────── */
  function renderImages(images) {
    const tbody = document.getElementById("images-body");
    if (!images.length) {
      tbody.innerHTML = '<tr><td colspan="4" class="empty" style="padding:12px 10px">No images found.</td></tr>';
      return;
    }
    tbody.innerHTML = images.map(i => `
      <tr>
        <td>${i.name}</td>
        <td class="img-id">${i.id}</td>
        <td>${i.size}</td>
        <td><button class="btn danger" data-img-id="${i.id}" data-img-name="${i.name}">Remove</button></td>
      </tr>`).join("");
    tbody.querySelectorAll("button[data-img-id]").forEach(btn => {
      btn.addEventListener("click", () => removeImage(btn.dataset.imgId, btn.dataset.imgName));
    });
  }

  async function removeImage(id, name) {
    if (!confirm(`Remove image "${name}"?`)) return;
    try {
      const res = await fetch(`/api/images/${encodeURIComponent(id)}`, { method: "DELETE" });
      const d = await res.json().catch(() => ({}));
      if (!res.ok) alert(d.error || "Remove failed.");
      else loadContainers();
    } catch { alert("Connection error."); }
  }

  const pullBtn    = document.getElementById("pull-btn");
  const pullStatus = document.getElementById("pull-status");

  document.getElementById("pull-form").addEventListener("submit", async ev => {
    ev.preventDefault();
    const name = document.getElementById("pull-image").value.trim();
    if (!name) return;
    pullBtn.disabled = true;
    pullStatus.textContent = "Pulling…";
    pullStatus.style.color = "var(--muted)";
    try {
      const res = await fetch("/api/images/pull", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ image: name }),
      });
      const d = await res.json().catch(() => ({}));
      if (!res.ok) {
        pullStatus.textContent = d.error || "Pull failed.";
        pullStatus.style.color = "var(--red)";
      } else {
        pullStatus.textContent = d.message || "Done.";
        pullStatus.style.color = "var(--green)";
        document.getElementById("pull-image").value = "";
        loadContainers();
      }
    } catch {
      pullStatus.textContent = "Connection error.";
      pullStatus.style.color = "var(--red)";
    }
    pullBtn.disabled = false;
  });

  /* ── Log modal ────────────────────────────────────────────────── */
  async function openLogs(cid, name) {
    document.getElementById("log-modal-title").textContent = `Logs — ${name}`;
    document.getElementById("log-content").textContent = "Loading…";
    document.getElementById("log-modal").classList.add("open");
    try {
      const res = await fetch(`/api/containers/${cid}/logs?tail=300`);
      const d = await res.json().catch(() => ({}));
      if (!res.ok) {
        document.getElementById("log-content").textContent = d.error || "Failed to fetch logs.";
      } else {
        const lines = d.lines || [];
        document.getElementById("log-content").textContent =
          lines.length ? lines.join("\n") : "(no output)";
        // auto-scroll to bottom
        const body = document.querySelector(".modal-body");
        body.scrollTop = body.scrollHeight;
      }
    } catch {
      document.getElementById("log-content").textContent = "Connection error.";
    }
  }

  document.getElementById("log-close").addEventListener("click", () => {
    document.getElementById("log-modal").classList.remove("open");
  });
  document.getElementById("log-modal").addEventListener("click", ev => {
    if (ev.target === ev.currentTarget)
      ev.currentTarget.classList.remove("open");
  });

  /* ── Boot ─────────────────────────────────────────────────────── */
  refresh();
  loadContainers();
  setInterval(refresh, 3000);
  setInterval(loadContainers, 8000);
</script>
</body>
</html>
