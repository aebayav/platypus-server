<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Platypus Dashboard</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #181b22;
    --border: #262a33;
    --text: #e6e8eb;
    --muted: #8b93a1;
    --green: #2ecc71;
    --red: #e74c3c;
    --yellow: #f1c40f;
    --accent: #4da3ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 24px;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 24px;
  }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .subtitle { color: var(--muted); font-size: 13px; }
  .error { color: var(--red); }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 16px;
    margin-bottom: 28px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px;
  }
  .card h3 {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 10px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .value { font-size: 28px; font-weight: 600; }
  .badge { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .bar {
    height: 8px;
    background: var(--border);
    border-radius: 4px;
    overflow: hidden;
    margin-top: 12px;
  }
  .bar > div {
    height: 100%;
    width: 0;
    background: var(--accent);
    border-radius: 4px;
    transition: width 0.4s ease;
  }

  .section-title { font-size: 16px; margin: 8px 0 14px; }
  .services {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 12px;
  }
  .service {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 16px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
  }
  .service .name { font-weight: 600; }
  .status-dot { width: 10px; height: 10px; border-radius: 50%; }
  .status-dot.up { background: var(--green); box-shadow: 0 0 8px var(--green); }
  .status-dot.down { background: var(--red); }
  .status-dot.unknown { background: var(--yellow); }

  .temp-grid { display: flex; flex-wrap: wrap; gap: 8px; }
  .temp-chip {
    background: var(--bg);
    border: 1px solid var(--border);
    padding: 6px 10px;
    border-radius: 8px;
    font-size: 13px;
  }

  .run-form {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  .run-form input {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 13px;
    flex: 1;
    min-width: 140px;
  }
  .run-form button {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 8px 16px;
    cursor: pointer;
  }

  .containers {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 12px;
    margin-bottom: 28px;
  }
  .container {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
  }
  .container-info { flex: 1; }
  .container .name { font-weight: 600; }
  .status-dot.running { background: var(--green); box-shadow: 0 0 8px var(--green); }
  .status-dot.exited, .status-dot.created, .status-dot.paused, .status-dot.dead { background: var(--red); }
  .status-dot.restarting, .status-dot.removing { background: var(--yellow); }
  .actions { display: flex; gap: 6px; }
  .btn {
    background: var(--border);
    color: var(--text);
    border: none;
    border-radius: 6px;
    padding: 5px 9px;
    font-size: 12px;
    cursor: pointer;
  }
  .btn.danger { background: var(--red); color: #fff; }
</style>
</head>
<body>
  <header>
    <div>
      <h1>Platypus Dashboard</h1>
      <div class="subtitle" id="last-updated">connecting…</div>
    </div>
    <div class="subtitle" id="uptime">—</div>
  </header>

  <div class="grid">
    <div class="card">
      <h3>CPU</h3>
      <div class="value" id="cpu">—</div>
      <div class="badge" id="load">—</div>
      <div class="bar"><div id="cpu-bar"></div></div>
    </div>
    <div class="card">
      <h3>Memory</h3>
      <div class="value" id="mem">—</div>
      <div class="bar"><div id="mem-bar"></div></div>
    </div>
    <div class="card">
      <h3>Disk</h3>
      <div class="value" id="disk">—</div>
      <div class="bar"><div id="disk-bar"></div></div>
    </div>
    <div class="card">
      <h3>Temperature</h3>
      <div class="temp-grid" id="temps"><span class="badge">no sensors</span></div>
    </div>
  </div>

  <div class="section-title">Containers</div>
  <form class="run-form" id="run-form">
    <input id="run-image" list="image-list" placeholder="image (e.g. nginx)" autocomplete="off">
    <datalist id="image-list"></datalist>
    <input id="run-name" placeholder="name (optional)">
    <input id="run-ports" placeholder="ports (e.g. 8080:80)">
    <button type="submit">Run</button>
  </form>
  <div class="containers" id="containers"><div class="badge">loading…</div></div>

  <div class="section-title">Services</div>
  <div class="services" id="services"></div>

  <script>
    function fmtBytes(n) {
      if (n == null) return "—";
      const units = ["B", "KB", "MB", "GB", "TB"];
      let i = 0;
      while (n >= 1024 && i < units.length - 1) { n /= 1024; i++; }
      return n.toFixed(1) + " " + units[i];
    }

    function fmtUptime(s) {
      if (s == null) return "—";
      const d = Math.floor(s / 86400);
      const h = Math.floor((s % 86400) / 3600);
      const m = Math.floor((s % 3600) / 60);
      return "uptime " + (d ? d + "d " : "") + h + "h " + m + "m";
    }

    function setBar(id, pct) {
      const el = document.getElementById(id);
      if (el) el.style.width = Math.max(0, Math.min(100, pct)) + "%";
    }

    function render(data) {
      const m = data.metrics || {};

      document.getElementById("cpu").textContent =
        m.cpu_percent != null ? m.cpu_percent.toFixed(1) + "%" : "—";
      setBar("cpu-bar", m.cpu_percent || 0);
      document.getElementById("load").textContent = m.load_avg
        ? "load " + m.load_avg.join(" / ")
        : (m.cpu_count ? m.cpu_count + " cores" : "—");

      const mem = m.memory || {};
      document.getElementById("mem").textContent = mem.percent != null
        ? fmtBytes(mem.used) + " / " + fmtBytes(mem.total)
        : "—";
      setBar("mem-bar", mem.percent || 0);

      const disk = m.disk || {};
      document.getElementById("disk").textContent = disk.percent != null
        ? fmtBytes(disk.used) + " / " + fmtBytes(disk.total)
        : "—";
      setBar("disk-bar", disk.percent || 0);

      const temps = m.temperatures || {};
      const keys = Object.keys(temps);
      const tempEl = document.getElementById("temps");
      if (keys.length) {
        tempEl.innerHTML = keys.map(k =>
          `<span class="temp-chip">${k}: <b>${temps[k]}°C</b></span>`
        ).join("");
      } else {
        tempEl.innerHTML = '<span class="badge">no sensors</span>';
      }

      document.getElementById("uptime").textContent = fmtUptime(m.uptime_seconds);

      const services = data.services || [];
      document.getElementById("services").innerHTML = services.map(s => `
        <div class="service">
          <div>
            <div class="name">${s.name}</div>
            <div class="badge">${s.url || ""}${s.http_code ? " · " + s.http_code : ""}</div>
          </div>
          <div class="status-dot ${s.status}"></div>
        </div>`).join("");

      document.getElementById("last-updated").textContent =
        "updated " + new Date().toLocaleTimeString();
      document.getElementById("last-updated").className = "subtitle";
    }

    async function refresh() {
      try {
        const res = await fetch("/api/status");
        if (!res.ok) throw new Error("HTTP " + res.status);
        render(await res.json());
      } catch (e) {
        const el = document.getElementById("last-updated");
        el.textContent = "connection error";
        el.className = "subtitle error";
      }
    }

    function renderContainers(containers) {
      const el = document.getElementById("containers");
      if (!containers.length) {
        el.innerHTML = '<div class="badge">no containers</div>';
        return;
      }
      el.innerHTML = containers.map(c => `
        <div class="container">
          <div class="container-info">
            <div class="name">${c.name}</div>
            <div class="badge">${c.image}${c.ports ? " · " + c.ports : ""}</div>
          </div>
          <div class="status-dot ${c.state}"></div>
          <div class="actions">
            ${c.state !== "running" ? `<button class="btn" data-act="start" data-id="${c.id}">Start</button>` : ""}
            ${c.state === "running" ? `<button class="btn" data-act="stop" data-id="${c.id}">Stop</button><button class="btn" data-act="restart" data-id="${c.id}">Restart</button>` : ""}
            <button class="btn danger" data-act="remove" data-id="${c.id}">Remove</button>
          </div>
        </div>`).join("");
      el.querySelectorAll("button[data-act]").forEach(btn => {
        btn.addEventListener("click", () => act(btn.dataset.act, btn.dataset.id));
      });
    }

    function renderImageList(images) {
      document.getElementById("image-list").innerHTML = images
        .map(i => `<option value="${i.name}">`)
        .join("");
    }

    async function act(action, id) {
      if (action === "remove" && !confirm("Remove container " + id + "?")) return;
      const url = action === "remove"
        ? `/api/containers/${id}`
        : `/api/containers/${id}/${action}`;
      try {
        const res = await fetch(url, { method: action === "remove" ? "DELETE" : "POST" });
        if (!res.ok) {
          const d = await res.json().catch(() => ({}));
          alert(d.error || "operation failed");
        }
      } catch (e) {
        alert("connection error");
      }
      loadContainers();
    }

    async function loadContainers() {
      const el = document.getElementById("containers");
      try {
        const [cres, ires] = await Promise.all([
          fetch("/api/containers"),
          fetch("/api/images"),
        ]);
        renderContainers((await cres.json()).containers || []);
        renderImageList((await ires.json()).images || []);
      } catch (e) {
        el.innerHTML = '<div class="badge error">docker unavailable</div>';
      }
    }

    document.getElementById("run-form").addEventListener("submit", async (ev) => {
      ev.preventDefault();
      const payload = {
        image: document.getElementById("run-image").value,
        name: document.getElementById("run-name").value,
        ports: document.getElementById("run-ports").value,
      };
      try {
        const res = await fetch("/api/containers", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        const d = await res.json().catch(() => ({}));
        if (!res.ok) {
          alert(d.error || "run failed");
        } else {
          document.getElementById("run-form").reset();
          loadContainers();
        }
      } catch (e) {
        alert("connection error");
      }
    });

    refresh();
    loadContainers();
    setInterval(refresh, 3000);
    setInterval(loadContainers, 5000);
  </script>
</body>
</html>
