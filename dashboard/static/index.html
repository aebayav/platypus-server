<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Platypus Dashboard</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #181b22;
    --border: #262a33;
    --text: #e6e8eb;
    --muted: #8b93a1;
    --green: #2ecc71;
    --red: #e74c3c;
    --yellow: #f1c40f;
    --accent: #4da3ff;
    --bar-bg: #262a33;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 24px;
    min-height: 100vh;
  }

  /* ── Header ─────────────────────────────────── */
  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 28px;
  }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .subtitle { color: var(--muted); font-size: 13px; }

  #conn-banner {
    display: none;
    background: #3d1a1a;
    border: 1px solid var(--red);
    color: var(--red);
    font-size: 13px;
    padding: 8px 14px;
    border-radius: 8px;
    margin-bottom: 16px;
  }

  /* ── Metric cards ───────────────────────────── */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 16px;
    margin-bottom: 32px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px;
  }
  .card h3 {
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 10px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
  }
  .value { font-size: 26px; font-weight: 600; line-height: 1; }
  .badge { font-size: 12px; color: var(--muted); margin-top: 6px; }

  /* Progress bar */
  .bar {
    height: 6px;
    background: var(--bar-bg);
    border-radius: 3px;
    overflow: hidden;
    margin-top: 14px;
  }
  .bar > div {
    height: 100%;
    width: 0;
    border-radius: 3px;
    transition: width 0.5s ease, background 0.5s ease;
    background: var(--green);
  }
  .bar > div.warn  { background: var(--yellow); }
  .bar > div.crit  { background: var(--red); }

  /* Temperature chips */
  .temp-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .temp-chip {
    border: 1px solid var(--border);
    padding: 5px 10px;
    border-radius: 8px;
    font-size: 13px;
    background: var(--bg);
  }
  .temp-chip.warm { border-color: var(--yellow); color: var(--yellow); }
  .temp-chip.hot  { border-color: var(--red);    color: var(--red); }

  /* Network row */
  .net-row {
    display: flex;
    gap: 20px;
    margin-top: 8px;
  }
  .net-item { font-size: 13px; }
  .net-label { color: var(--muted); font-size: 11px; }

  /* ── Section header ─────────────────────────── */
  .section-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 8px 0 16px;
  }
  .section-header h2 { font-size: 15px; white-space: nowrap; }
  .section-header::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* ── Run form ───────────────────────────────── */
  .run-form {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  .run-form input {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 13px;
    flex: 1;
    min-width: 140px;
  }
  .run-form input:focus { outline: none; border-color: var(--accent); }
  .run-form button {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 8px 18px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
  }
  .run-form button:hover { opacity: 0.88; }

  /* ── Containers ─────────────────────────────── */
  .containers {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 12px;
    margin-bottom: 32px;
  }
  .container-card {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
  }
  .container-card .cinfo { flex: 1; min-width: 0; }
  .container-card .cname { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .container-card .cbadge { font-size: 12px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* State indicator */
  .state-pill {
    font-size: 11px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 20px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .state-pill.running   { background: #1a3a27; color: var(--green); }
  .state-pill.exited,
  .state-pill.dead      { background: #3d1a1a; color: var(--red); }
  .state-pill.created,
  .state-pill.paused    { background: #3a3010; color: var(--yellow); }
  .state-pill.restarting{ background: #1a2e3a; color: var(--accent); }

  .actions { display: flex; gap: 6px; flex-shrink: 0; }
  .btn {
    background: var(--border);
    color: var(--text);
    border: none;
    border-radius: 6px;
    padding: 5px 10px;
    font-size: 12px;
    cursor: pointer;
    white-space: nowrap;
  }
  .btn:hover { opacity: 0.8; }
  .btn.danger { background: #3d1a1a; color: var(--red); border: 1px solid var(--red); }
  .btn.danger:hover { background: var(--red); color: #fff; }

  /* ── Services ───────────────────────────────── */
  .services {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 12px;
    margin-bottom: 32px;
  }
  .service {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 16px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    border-left-width: 3px;
    transition: border-color 0.3s;
  }
  .service.up   { border-left-color: var(--green); }
  .service.down { border-left-color: var(--red); }
  .service.unknown { border-left-color: var(--yellow); }
  .service .sname { font-weight: 600; font-size: 14px; }
  .service .surl  { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .service .scode {
    font-size: 11px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 20px;
    flex-shrink: 0;
    margin-left: 8px;
  }
  .service .scode.up   { background: #1a3a27; color: var(--green); }
  .service .scode.down { background: #3d1a1a; color: var(--red); }
  .service .scode.unknown { background: #3a3010; color: var(--yellow); }

  .empty { color: var(--muted); font-size: 13px; padding: 4px 0; }
</style>
</head>
<body>

  <div id="conn-banner">Connection lost — retrying…</div>

  <header>
    <div>
      <h1>Platypus Dashboard</h1>
      <div class="subtitle" id="last-updated">connecting…</div>
    </div>
    <div class="subtitle" id="uptime">—</div>
  </header>

  <!-- Metric cards -->
  <div class="grid">
    <div class="card">
      <h3>CPU</h3>
      <div class="value" id="cpu">—</div>
      <div class="badge" id="cpu-cores">—</div>
      <div class="badge" id="load">—</div>
      <div class="bar"><div id="cpu-bar"></div></div>
    </div>
    <div class="card">
      <h3>Memory</h3>
      <div class="value" id="mem">—</div>
      <div class="badge" id="mem-pct">—</div>
      <div class="bar"><div id="mem-bar"></div></div>
    </div>
    <div class="card">
      <h3>Disk</h3>
      <div class="value" id="disk">—</div>
      <div class="badge" id="disk-free">—</div>
      <div class="bar"><div id="disk-bar"></div></div>
    </div>
    <div class="card">
      <h3>Temperature</h3>
      <div class="temp-grid" id="temps"><span class="badge">no sensors</span></div>
    </div>
    <div class="card">
      <h3>Network</h3>
      <div class="net-row">
        <div class="net-item">
          <div class="net-label">Received</div>
          <div id="net-recv">—</div>
        </div>
        <div class="net-item">
          <div class="net-label">Sent</div>
          <div id="net-sent">—</div>
        </div>
      </div>
      <div class="badge" id="net-packets" style="margin-top:10px">—</div>
    </div>
  </div>

  <!-- Containers -->
  <div class="section-header"><h2>Containers</h2></div>
  <form class="run-form" id="run-form">
    <input id="run-image" list="image-list" placeholder="image (e.g. nginx)" autocomplete="off">
    <datalist id="image-list"></datalist>
    <input id="run-name" placeholder="name (optional)">
    <input id="run-ports" placeholder="ports (e.g. 8080:80)">
    <button type="submit">Run</button>
  </form>
  <div class="containers" id="containers"><div class="empty">loading…</div></div>

  <!-- Services -->
  <div class="section-header"><h2>Services</h2></div>
  <div class="services" id="services"></div>

<script>
  /* ── Helpers ──────────────────────────────────────────────────── */
  function fmtBytes(n) {
    if (n == null) return "—";
    const units = ["B", "KB", "MB", "GB", "TB"];
    let i = 0;
    while (n >= 1024 && i < units.length - 1) { n /= 1024; i++; }
    return n.toFixed(1) + " " + units[i];
  }

  function fmtUptime(s) {
    if (s == null) return "—";
    const d = Math.floor(s / 86400);
    const h = Math.floor((s % 86400) / 3600);
    const m = Math.floor((s % 3600) / 60);
    return "uptime " + (d ? d + "d " : "") + h + "h " + m + "m";
  }

  /* Set progress bar width + colour class based on percentage */
  function setBar(id, pct) {
    const el = document.getElementById(id);
    if (!el) return;
    const clamped = Math.max(0, Math.min(100, pct));
    el.style.width = clamped + "%";
    el.classList.remove("warn", "crit");
    if (clamped >= 90) el.classList.add("crit");
    else if (clamped >= 70) el.classList.add("warn");
  }

  /* ── Metrics render ───────────────────────────────────────────── */
  function render(data) {
    const m = data.metrics || {};

    // CPU
    const cpuPct = m.cpu_percent != null ? m.cpu_percent : null;
    document.getElementById("cpu").textContent =
      cpuPct != null ? cpuPct.toFixed(1) + "%" : "—";
    document.getElementById("cpu-cores").textContent =
      m.cpu_count ? m.cpu_count + " cores" : "—";
    document.getElementById("load").textContent = m.load_avg
      ? "load avg  " + m.load_avg.join(" / ")
      : "";
    setBar("cpu-bar", cpuPct || 0);

    // Memory
    const mem = m.memory || {};
    document.getElementById("mem").textContent = mem.used != null
      ? fmtBytes(mem.used) + " / " + fmtBytes(mem.total)
      : "—";
    document.getElementById("mem-pct").textContent = mem.percent != null
      ? mem.percent.toFixed(1) + "% used"
      : "—";
    setBar("mem-bar", mem.percent || 0);

    // Disk
    const disk = m.disk || {};
    document.getElementById("disk").textContent = disk.used != null
      ? fmtBytes(disk.used) + " / " + fmtBytes(disk.total)
      : "—";
    document.getElementById("disk-free").textContent = disk.free != null
      ? fmtBytes(disk.free) + " free"
      : "—";
    setBar("disk-bar", disk.percent || 0);

    // Temperatures
    const temps = m.temperatures || {};
    const keys = Object.keys(temps);
    const tempEl = document.getElementById("temps");
    if (keys.length) {
      tempEl.innerHTML = keys.map(k => {
        const v = temps[k];
        const cls = v >= 85 ? "hot" : v >= 70 ? "warm" : "";
        return `<span class="temp-chip ${cls}">${k}: <b>${v}°C</b></span>`;
      }).join("");
    } else {
      tempEl.innerHTML = '<span class="badge">no sensors</span>';
    }

    // Network
    const net = m.network || {};
    document.getElementById("net-recv").textContent =
      net.bytes_recv != null ? fmtBytes(net.bytes_recv) : "—";
    document.getElementById("net-sent").textContent =
      net.bytes_sent != null ? fmtBytes(net.bytes_sent) : "—";
    document.getElementById("net-packets").textContent =
      net.packets_recv != null
        ? `${net.packets_recv.toLocaleString()} pkts in  /  ${net.packets_sent.toLocaleString()} pkts out`
        : "—";

    // Uptime
    document.getElementById("uptime").textContent = fmtUptime(m.uptime_seconds);

    // Services
    const services = data.services || [];
    document.getElementById("services").innerHTML = services.length
      ? services.map(s => {
          const statusClass = s.status || "unknown";
          const codeLabel = s.http_code
            ? s.http_code
            : (s.status === "up" ? "UP" : s.status === "down" ? "DOWN" : "?");
          return `
            <div class="service ${statusClass}">
              <div>
                <div class="sname">${s.name}</div>
                <div class="surl">${s.url || ""}</div>
              </div>
              <span class="scode ${statusClass}">${codeLabel}</span>
            </div>`;
        }).join("")
      : '<div class="empty">No services configured.</div>';

    // Connection OK
    document.getElementById("conn-banner").style.display = "none";
    const upd = document.getElementById("last-updated");
    upd.textContent = "updated " + new Date().toLocaleTimeString();
    upd.style.color = "";
  }

  /* ── Polling ──────────────────────────────────────────────────── */
  async function refresh() {
    try {
      const res = await fetch("/api/status");
      if (!res.ok) throw new Error("HTTP " + res.status);
      render(await res.json());
    } catch {
      document.getElementById("conn-banner").style.display = "block";
      const upd = document.getElementById("last-updated");
      upd.textContent = "connection error";
      upd.style.color = "var(--red)";
    }
  }

  /* ── Containers ───────────────────────────────────────────────── */
  function renderContainers(containers) {
    const el = document.getElementById("containers");
    if (!containers.length) {
      el.innerHTML = '<div class="empty">No containers running.</div>';
      return;
    }
    el.innerHTML = containers.map(c => {
      const stateClass = c.state || "unknown";
      const stateLabel = c.state
        ? c.state.charAt(0).toUpperCase() + c.state.slice(1)
        : "Unknown";
      const startBtn = c.state !== "running"
        ? `<button class="btn" data-act="start" data-id="${c.id}">Start</button>` : "";
      const stopBtn = c.state === "running"
        ? `<button class="btn" data-act="stop" data-id="${c.id}">Stop</button>` : "";
      const restartBtn = c.state === "running"
        ? `<button class="btn" data-act="restart" data-id="${c.id}">Restart</button>` : "";
      return `
        <div class="container-card">
          <div class="cinfo">
            <div class="cname">${c.name}</div>
            <div class="cbadge">${c.image}${c.ports ? " · " + c.ports : ""}</div>
          </div>
          <span class="state-pill ${stateClass}">${stateLabel}</span>
          <div class="actions">
            ${startBtn}${stopBtn}${restartBtn}
            <button class="btn danger" data-act="remove" data-id="${c.id}">Remove</button>
          </div>
        </div>`;
    }).join("");
    el.querySelectorAll("button[data-act]").forEach(btn => {
      btn.addEventListener("click", () => act(btn.dataset.act, btn.dataset.id));
    });
  }

  function renderImageList(images) {
    document.getElementById("image-list").innerHTML = images
      .map(i => `<option value="${i.name}">`)
      .join("");
  }

  async function act(action, id) {
    if (action === "remove" && !confirm("Remove container " + id + "?")) return;
    const url = action === "remove"
      ? `/api/containers/${id}`
      : `/api/containers/${id}/${action}`;
    try {
      const res = await fetch(url, { method: action === "remove" ? "DELETE" : "POST" });
      if (!res.ok) {
        const d = await res.json().catch(() => ({}));
        alert(d.error || "operation failed");
      }
    } catch {
      alert("connection error");
    }
    loadContainers();
  }

  async function loadContainers() {
    try {
      const [cres, ires] = await Promise.all([
        fetch("/api/containers"),
        fetch("/api/images"),
      ]);
      renderContainers((await cres.json()).containers || []);
      renderImageList((await ires.json()).images || []);
    } catch {
      document.getElementById("containers").innerHTML =
        '<div class="empty" style="color:var(--red)">Docker unavailable.</div>';
    }
  }

  document.getElementById("run-form").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const payload = {
      image: document.getElementById("run-image").value,
      name:  document.getElementById("run-name").value,
      ports: document.getElementById("run-ports").value,
    };
    try {
      const res = await fetch("/api/containers", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      const d = await res.json().catch(() => ({}));
      if (!res.ok) {
        alert(d.error || "run failed");
      } else {
        document.getElementById("run-form").reset();
        loadContainers();
      }
    } catch {
      alert("connection error");
    }
  });

  /* ── Boot ─────────────────────────────────────────────────────── */
  refresh();
  loadContainers();
  setInterval(refresh, 3000);
  setInterval(loadContainers, 5000);
</script>
</body>
</html>
