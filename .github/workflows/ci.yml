name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint & static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[dev]"

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r requirements.yml -p collections

      - name: Run Ruff Python linter
        run: ruff check .

      - name: Validate module schemas and port claims
        run: platypus module lint

      - name: Syntax check playbooks
        run: ansible-playbook --syntax-check playbooks/site.yml -i inventory/dev

      - name: Run ansible-lint
        run: ansible-lint

      - name: Run yamllint
        run: yamllint .

      - name: Shell syntax & ShellCheck
        run: |
          bash -n bootstrap.sh scripts/*.sh
          shellcheck -S warning bootstrap.sh scripts/*.sh

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q

  molecule:
    name: Molecule role test (${{ matrix.role }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        role: ["common", "security", "platypus"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ansible & Molecule
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          ansible-galaxy collection install -r requirements.yml -p collections
      - name: Run Molecule scenario
        working-directory: roles/${{ matrix.role }}
        env:
          ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}/collections
        run: molecule test

  security_scan:
    name: Trivy IaC & vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy filesystem & misconfig scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: "fs"
          scan-ref: "."
          scanners: "vuln,secret,misconfig"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          exit-code: "0"

  package:
    name: Build wheel & smoke-test install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Install the wheel into a clean venv
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
      - name: Import smoke + packaged-data probe
        working-directory: /tmp
        run: |
          /tmp/smoke/bin/python - <<'EOF'
          import platypus_cli, tui.app, dashboard.app, recipe.cli, zero2server.cli, doctor
          import recipe.model
          assert "site-packages" in recipe.model.__file__, (
              "probe imported the checkout, not the wheel: "
              + recipe.model.__file__
          )
          from recipe.model import builtin_roles
          roles = set(builtin_roles())
          expected = {"minecraft-server", "storage-nextcloud", "storage-samba",
                      "pihole", "syncthing", "jellyfin", "assetto-corsa", "monitoring"}
          assert expected <= roles, f"wheel is missing role data: {expected - roles}"
          print("packaged roles OK:", sorted(roles))
          EOF
          /tmp/smoke/bin/platypus --version
          /tmp/smoke/bin/platypus --help > /dev/null
