---
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "terraform"
    directory: "/infra/terraform/hcloud"
    schedule:
      interval: "monthly"

  - package-ecosystem: "terraform"
    directory: "/infra/terraform/digitalocean"
    schedule:
      interval: "monthly"
