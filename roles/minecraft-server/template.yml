# Minecraft Java Edition role template
#
# Stop sequence (pre_remove hooks):
#   1. rcon-cli save-all  — flush world data to disk
#   2. rcon-cli stop      — graceful server exit (container stops itself)
#   3. sleep 3            — brief pause for I/O to complete
#   Then: docker compose down  (container already exited, just cleaned up)
#
# ./data is a bind mount. docker compose down never touches it.

role: minecraft-server
version: "1.0"
description: "Minecraft Java Edition sunucusu (itzg/minecraft-server)"

# No standalone shutdown section — RCON is handled via pre_remove hooks below.

hooks:
  pre_remove:
    - "docker exec platypus-minecraft rcon-cli save-all || true"
    - "docker exec platypus-minecraft rcon-cli stop || true"
    - "sleep 3"
  post_remove: []
  pre_apply: []
  post_apply:
    - "echo 'Minecraft server running on port {answers[port]}'"

# No Caddy HTTP route — Minecraft uses raw TCP (port 25565), not HTTP.
caddy:
  enabled: false

# -------------------------------------------------------------------
# docker-compose.yml template
# Placeholders resolved via {answers[<question_id>]}.
# RCON is enabled so pre_remove hooks can reach the server.
# -------------------------------------------------------------------
compose_template: |
  services:
    minecraft:
      image: itzg/minecraft-server
      container_name: platypus-minecraft
      restart: unless-stopped
      stdin_open: true
      tty: true
      ports:
        - "{answers[port]}:25565"
      environment:
        EULA: "TRUE"
        TYPE: "{answers[server_type]}"
        MEMORY: "{answers[memory]}"
        MAX_PLAYERS: "{answers[max_players]}"
        DIFFICULTY: "{answers[difficulty]}"
        ENABLE_RCON: "true"
        RCON_PASSWORD: "platypus"
        RCON_PORT: "25575"
      volumes:
        - ./data:/data
      healthcheck:
        test: ["CMD", "mc-health"]
        interval: 30s
        timeout: 10s
        retries: 3
        start_period: 60s
