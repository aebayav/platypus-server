---
# security role: multi-distro SSH hardening, firewall (UFW / firewalld), and fail2ban
- name: Ensure the sshd drop-in directory exists
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Write the SSH hardening drop-in config
  ansible.builtin.copy:
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      PubkeyAuthentication yes
      KbdInteractiveAuthentication no
      X11Forwarding no
      MaxAuthTries 3
      ClientAliveInterval 300
      ClientAliveCountMax 2
    dest: /etc/ssh/sshd_config.d/99-hardening.conf
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Restart SSH service

- name: Install UFW on non-RedHat systems
  ansible.builtin.package:
    name: ufw
    state: present
  become: true
  when:
    - security_manage_firewall | bool
    - ansible_os_family != "RedHat"

- name: Set UFW default policies
  community.general.ufw:
    direction: "{{ item.direction }}"
    policy: "{{ item.policy }}"
  loop:
    - {direction: incoming, policy: deny}
    - {direction: outgoing, policy: allow}
  become: true
  when:
    - security_manage_firewall | bool
    - ansible_os_family != "RedHat"

- name: Allow SSH through UFW
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp
  become: true
  when:
    - security_manage_firewall | bool
    - ansible_os_family != "RedHat"

- name: Allow HTTP and HTTPS through UFW (VPS only)
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop:
    - "80"
    - "443"
  become: true
  when:
    - security_manage_firewall | bool
    - ansible_os_family != "RedHat"
    - platypus_target == "vps"

- name: Allow the Tailscale interface through UFW (home server only)
  community.general.ufw:
    rule: allow
    interface: tailscale0
  become: true
  when:
    - security_manage_firewall | bool
    - ansible_os_family != "RedHat"
    - platypus_target == "home"

- name: Enable UFW
  community.general.ufw:
    state: enabled
  become: true
  when:
    - security_manage_firewall | bool
    - ansible_os_family != "RedHat"

- name: Install firewalld on RedHat-family systems
  ansible.builtin.package:
    name: firewalld
    state: present
  become: true
  when:
    - security_manage_firewall | bool
    - ansible_os_family == "RedHat"

- name: Enable and start firewalld on RedHat-family systems
  ansible.builtin.service:
    name: firewalld
    state: started
    enabled: true
  become: true
  when:
    - security_manage_firewall | bool
    - ansible_os_family == "RedHat"

- name: Allow SSH through firewalld
  ansible.posix.firewalld:
    service: ssh
    permanent: true
    immediate: true
    state: enabled
  become: true
  when:
    - security_manage_firewall | bool
    - ansible_os_family == "RedHat"

- name: Allow HTTP and HTTPS through firewalld (VPS only)
  ansible.posix.firewalld:
    service: "{{ item }}"
    permanent: true
    immediate: true
    state: enabled
  loop:
    - http
    - https
  become: true
  when:
    - security_manage_firewall | bool
    - ansible_os_family == "RedHat"
    - platypus_target == "vps"

- name: Trust Tailscale interface in firewalld (home server only)
  ansible.posix.firewalld:
    zone: trusted
    interface: tailscale0
    permanent: true
    immediate: true
    state: enabled
  become: true
  when:
    - security_manage_firewall | bool
    - ansible_os_family == "RedHat"
    - platypus_target == "home"

- name: Install fail2ban (VPS only)
  ansible.builtin.package:
    name: fail2ban
    state: present
  become: true
  when:
    - platypus_target == "vps"

- name: Enable and start fail2ban (VPS only)
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true
  become: true
  when:
    - platypus_target == "vps"
