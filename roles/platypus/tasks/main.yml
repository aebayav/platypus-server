---
# platypus role: tasks
# Application installation and deployment steps go here.
- name: Create the application user
  ansible.builtin.user:
    name: "{{ app_user }}"
    system: true
    create_home: true
    shell: /bin/bash
  become: true

- name: Create the application directory
  # The app directory lives under /opt/platypus (the runtime root, next to
  # state.yml and roles/). It must NOT be /opt/{{ app_name }}: that path is
  # the git checkout, and chowning it to the app user breaks bootstrap's
  # `git pull` with "dubious ownership".
  ansible.builtin.file:
    path: "/opt/platypus/{{ app_name }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0755"
  become: true
